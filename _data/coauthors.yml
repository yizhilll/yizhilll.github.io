# Maps a co-author's last name (lowercase) to the URL shown on the publications page.
# `firstname` lists every spelling that should match, so that common last names
# (Zhang, Lin, Liu, ...) only link when the first name matches too.

"lin":
  - firstname: ["Chenghua", "C."]
    url: https://chenghua-lin.github.io/

"zhang":
  - firstname: ["Ge", "G."]
    url: https://scholar.google.com/citations?user=qyTrq4kAAAAJ

"yuan":
  - firstname: ["Ruibin", "R."]
    url: https://github.com/a43992899

"ma":
  - firstname: ["Yinghao", "Y."]
    url: https://nicolaus625.github.io/

"fu":
  - firstname: ["Jie", "J."]
    url: https://bigaidream.github.io/

"liu":
  - firstname: ["Zhiyuan", "Z."]
    url: https://nlp.csai.tsinghua.edu.cn/~lzy/

"wu":
  - firstname: ["Siwei", "S."]
    url: https://github.com/Wusiwei0410
